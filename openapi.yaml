openapi: 3.0.4
info:
  title: Disposable Email Checker
  description: >-
    Disposable Email Checker is a disposable email detection API that tests
    whether an email address belongs to a disposable or temp mail provider. Pass
    any email to receive its domain and a true or false flag showing if it is
    temporary.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/emaildisposablechecker:
    get:
      summary: Disposable Email Checker
      description: Check if an email address is disposable
      operationId: emaildisposablechecker
      parameters:
        - name: email
          in: query
          schema:
            type: string
          required: true
          description: The email address to check (e.g., support@myspace.com)
          example: support@myspace.com
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  isDisposable: false
                  email: support@myspace.com
                  domain: myspace.com
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
